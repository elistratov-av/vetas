openapi: 3.0.0
info:
  title: Документация для разработчика ВетАС
  description: Эта документация предназначена для ознакомления с существующими ендпоинтами ВетАС.
  version: 1.0.0
tags:
  - name: Аналитика
    description: Раздел для запросов аналитики
  - name: Приюты
    description: Раздел для запросов по приютам
  - name: Телеветеренария
    description: Раздел для запросов по телевету
  - name: Поиск питомцев
    description: Раздел для запросов по поиску питомцев
servers:
  - url: https://backend.local/
    description: Локальная среда разработки
  - url: https://api-vetas-prod.starlink-soft.ru/
    description: Тестовый стенд
  - url: https://api-vetas-predprod.mos.ru/
    description: Предпродакшен среда
  - url: https://api-vetas.mos.ru/
    description: Продакшен среда
paths:
  /v3/analytics/dictionary:
    get:
      summary: Справочник для аналитики
      tags: 
      - Аналитика
      description: |
        Этот запрос предназначен для получения справочника, содержащего информацию о доступных областях, каналах, районах, организациях, специалистах, видах, статусах и типах для аналитики.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_success:
                    type: boolean
                    description: Признак успешности ответа
                  data:
                    type: object
                    properties:
                      areas:
                        type: array
                        description: Список округов
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: ID округа
                            name:
                              type: string
                              description: Название округа
                            area_id:
                              type: integer
                              description: ID округа
                      channels:
                        type: array
                        description: Список каналов
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: ID канала
                            name:
                              type: string
                              description: Название канала
                      districts:
                        type: array
                        description: Список районов
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: ID района
                            name:
                              type: string
                              description: Название района
                            area_id:
                              type: integer
                              description: Родительский округ (ID)
                      organizations:
                        type: array
                        description: Список организаций
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: ID организации
                            name:
                              type: string
                              description: Название организации
                            area_id:
                              type: integer
                              description: Родительский округ (ID)
                            district_id:
                              type: integer
                              description: Родительский район (ID)
                      specialists:
                        type: array
                        description: Список специалистов
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: ID специалиста
                            name:
                              type: string
                              description: Имя специалиста
                            organization_id:
                              type: integer
                              description: ID организации
                      species:
                        type: array
                        description: Список видов
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: ID вида
                            name:
                              type: string
                              description: Название вида
                      statuses:
                        type: array
                        description: Список статусов
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: ID статуса
                            name:
                              type: string
                              description: Название статуса
                      types:
                        type: array
                        description: Список типов
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: ID типа
                            name:
                              type: string
                              description: Название типа
                      services:
                        type: array
                        description: Список категорий услуг
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: ID категории
                            name:
                              type: string
                              description: Название категории
                            services:
                              type: array
                              description: Список услуг в категории
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    description: ID услуги
                                  name:
                                    type: string
                                    description: Название услуги
                                  code:
                                    type: string
                                    description: Код услуги
  /v3/analytics/service/report:
    post:
      tags:
        - Аналитика
      summary: Отчет по количеству услуг
      description: |
        Этот эндпоинт принимает параметры для генерации отчета по количеству услуг, включая общую статистику по источникам записи на прием, суммарно по всем округам, суммарно по организациям и отдельно по услугам.<p>
        В итоге выполнения запроса будет получена информация об общем количестве услуг и разделенных по каналам записи.
        Аналогичная информация имеется для округа, организации, и отдельно взятой услуги, оказанной в каждой из организаций.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                from:
                  $ref: '#/components/schemas/from'
                to:
                  $ref: '#/components/schemas/to'
                excel:
                  $ref: '#/components/schemas/excel'
                areas:
                  $ref: '#/components/schemas/areas'
                organizations:
                  $ref: '#/components/schemas/organizations'
                services:
                  $ref: '#/components/schemas/services'
                statuses:
                  $ref: '#/components/schemas/statuses'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_success:
                    type: boolean
                    description: Признак успешности ответа
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                        description: Общее количество
                      channels:
                        type: array
                        description: Статистика по каналам записи
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: ID канала
                            type:
                              type: string
                              description: Код канала
                            name:
                              type: string
                              description: Название канала
                            count:
                              type: integer
                              description: Количество по каналу
                      areas:
                        type: array
                        description: Статистика по административным округам
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: ID округа
                            name:
                              type: string
                              description: Название округа
                            count:
                              type: integer
                              description: Общее количество по округу
                            channels:
                              type: array
                              description: Статистика по каналам записи в округе
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    description: ID канала
                                  type:
                                    type: string
                                    description: Код канала
                                  name:
                                    type: string
                                    description: Название канала
                                  count:
                                    type: integer
                                    description: Количество по каналу
                            organizations:
                              type: array
                              description: Статистика по организациям в округе
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    description: ID организации
                                  name:
                                    type: string
                                    description: Название организации
                                  count:
                                    type: integer
                                    description: Количество по организации
                                  channels:
                                    type: array
                                    description: Статистика по каналам записи в организации
                                    items:
                                      type: object
                                      properties:
                                        id:
                                          type: integer
                                          description: ID канала
                                        type:
                                          type: string
                                          description: Код канала
                                        name:
                                          type: string
                                          description: Название канала
                                        count:
                                          type: integer
                                          description: Количество по каналу
                                  services:
                                    type: array
                                    description: Статистика по услугам в организации
                                    items:
                                      type: object
                                      properties:
                                        id:
                                          type: integer
                                          description: ID услуги
                                        name:
                                          type: string
                                          description: Название услуги
                                        count:
                                          type: integer
                                          description: Общее количество по услуге
                                        channels:
                                          type: array
                                          description: Статистика по каналам записи для услуги
                                          items:
                                            type: object
                                            properties:
                                              id:
                                                type: integer
                                                description: ID канала
                                              type:
                                                type: string
                                                description: Код канала
                                              name:
                                                type: string
                                                description: Название канала
                                              count:
                                                type: integer
                                                description: Количество по каналу
  /v3/analytics/service/detail-report:
    post:
      summary: Детальный отчёт по количеству услуг
      description: |
        Этот запрос предназначен для получения количества оказанных. Принимает на вход даты ОТ и ДО, массивы в JSON - округа, организации, специалисты, типы примема, канал записи, вид животных, какие услуги учесть.<p>
        В итоге выполнения запроса будет получена информация об общем количестве услуг и разделенных по статусам приема.<p>Аналогичная информация имеется для округа, организации, и отдельно взятой услуги, оказанной в каждой из организаций.
      tags: 
        - Аналитика
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                from:
                  $ref: '#/components/schemas/from'
                to:
                  $ref: '#/components/schemas/to'
                excel:
                  $ref: '#/components/schemas/excel'
                areas:
                  $ref: '#/components/schemas/areas'
                organizations:
                  $ref: '#/components/schemas/organizations'
                specialists:
                  $ref: '#/components/schemas/specialists'
                services:
                  $ref: '#/components/schemas/services'
                types:
                  $ref: '#/components/schemas/types'
                channels:
                  $ref: '#/components/schemas/channels'
                species:
                  $ref: '#/components/schemas/species'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_success:
                    type: boolean
                    description: Признак успешности ответа
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                        description: Сколько приемов всего
                      statuses:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Статус приема
                            name:
                              type: string
                              description: Как отображается в отчете
                            count:
                              type: integer
                              description: Число приемов
                      areas:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: ID округа
                            name:
                              type: string
                              description: Название округа
                            count:
                              type: integer
                              description: Сколько приемов всего по округу
                            statuses:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    description: Статус приема для текущего округа
                                  name:
                                    type: string
                                    description: Как отображается в отчете
                                  count:
                                    type: integer
                                    description: Число приемов для текущего округа
                            organizations:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    description: ID организации
                                  name:
                                    type: string
                                    description: Название организации
                                  count:
                                    type: integer
                                    description: Число приемов для текущей организации
                                  statuses:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        id:
                                          type: string
                                          description: Статус приема для текущей организации
                                        name:
                                          type: string
                                          description: Как отображается в отчете
                                        count:
                                          type: integer
                                          description: Число приемов для текущей организации
                                    channels:
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          id:
                                            type: integer
                                            description: ID канала записи
                                          name:
                                            type: string
                                            description: Название канала
                                          count:
                                            type: integer
                                            description: Число приемов для текущего канала записи
                                          statuses:
                                            type: array
                                            items:
                                              type: object
                                              properties:
                                                id:
                                                  type: string
                                                  description: Статус приема для текущего канала записи
                                                name:
                                                  type: string
                                                  description: Как отображается в отчете
                                                count:
                                                  type: integer
                                                  description: Число приемов для текущего канала записи
                                                services:
                                                  type: array
                                                  items:
                                                    type: object
                                                    properties:
                                                      id:
                                                        type: integer
                                                        description: ID услуги
                                                      name:
                                                        type: string
                                                        description: Название услуги
                                                      count:
                                                        type: integer
                                                        description: Число приемов для текущей услуги
                                                      statuses:
                                                        type: array
                                                        items:
                                                          type: object
                                                          properties:
                                                            id:
                                                              type: string
                                                              description: Статус приема для текущей услуги
                                                            name:
                                                              type: string
                                                              description: Как отображается в отчете
                                                            count:
                                                              type: integer
                                                              description: Число приемов для текущей услуги
  /v3/analytics/service-price/report:
    post:
      tags:
        - Аналитика
      summary: Отчёт об оказании ветеринарных услуг
      description: |
        Этот эндпоинт получает на вход даты отчёта, распечатку в Excel, охват по округам, районам и организациям.<p>
        Отдает суммарную статистику по сумме услуг, по их количеству, для льготных групп.<p>
        Информация будет получена по всем округам, отдельно по каждому округу, району, организации и отдельно по каждой услуге.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                from:
                  $ref: '#/components/schemas/from'
                to:
                  $ref: '#/components/schemas/to'
                excel:
                  $ref: '#/components/schemas/excel'
                areas:
                  $ref: '#/components/schemas/areas'
                districts:
                  $ref: '#/components/schemas/districts'
                organizations:
                  $ref: '#/components/schemas/organizations'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_success:
                    type: boolean
                    description: Признак успешности ответа
                  data:
                    type: object
                    properties:
                      columns:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: ID признака данных
                            name:
                              type: string
                              description: Название признака данных
                            value:
                              type: number
                              format: float
                              description: Сумма признака данных
                      areas:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: ID области
                            name:
                              type: string
                              description: Название области
                            columns:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    description: ID признака данных
                                  name:
                                    type: string
                                    description: Название признака данных
                                  value:
                                    type: number
                                    format: float
                                    description: Сумма признака данных
                            districts:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    description: ID района
                                  name:
                                    type: string
                                    description: Название района
                                  columns:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        id:
                                          type: string
                                          description: ID признака данных
                                        name:
                                          type: string
                                          description: Название признака данных
                                        value:
                                          type: number
                                          format: float
                                          description: Сумма признака данных
                                  organizations:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        id:
                                          type: integer
                                          description: ID организации
                                        name:
                                          type: string
                                          description: Название организации
                                        columns:
                                          type: array
                                          items:
                                            type: object
                                            properties:
                                              id:
                                                type: string
                                                description: ID признака данных
                                              name:
                                                type: string
                                                description: Название признака данных
                                              value:
                                                type: number
                                                format: float
                                                description: Сумма признака данных
                                        services:
                                          type: array
                                          items:
                                            type: object
                                            properties:
                                              id:
                                                type: integer
                                                description: ID услуги
                                              name:
                                                type: string
                                                description: Название услуги
                                              columns:
                                                type: array
                                                items:
                                                  type: object
                                                  properties:
                                                    id:
                                                      type: string
                                                      description: ID признака данных
                                                    name:
                                                      type: string
                                                      description: Название признака данных
                                                    value:
                                                      type: number
                                                      format: float
                                                      description: Сумма признака данных
  /v3/analytics/visit/report:
      post:
        summary: Общий отчет по приемам
        tags: 
        - Аналитика
        description: |
          Этот запрос предназначен для получения общего отчета по приемам, фильтруемого по датам, округам, районам и организациям.
        requestBody:
          required: true
