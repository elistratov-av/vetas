                                description: Название округа
                              count:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                      description: Название категории
                                    count:
                                      type: integer
                                      description: Количество визитов
                                    id:
                                      type: string
                                      description: ID категории
                              districts:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
                                      type: integer
                                      description: ID района
                                    name:
                                      type: string
                                      description: Название района
                                    count:
                                      type: array
                                      items:
