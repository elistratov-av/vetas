                                          id:
                                            type: string
                                            description: ID категории
                                    organizations:
                                      type: array
                                      items:
                                        type: object
                                        properties:
                                          id:
                                            type: integer
                                            description: ID организации
                                          name:
                                            type: string
                                            description: Название организации
                                          count:
                                            type: array
                                            items:
                                              type: object
                                              properties:
                                                name:
                                                  type: string
                                                  description: Название категории
                                                count:
                                                  type: integer
                                                  description: Количество визитов
                                                id:
                                                  type: string
                                                  description: ID категории
                                          channels:
                                            type: array
                                            items:
                                              type: object
                                              properties:
                                                id:
                                                  type: integer
                                                  description: ID канала
                                                name:
                                                  type: string
                                                  description: Название канала
                                                count:
                                                  type: array
                                                  items:
                                                    type: object
                                                    properties:
                                                      name:
                                                        type: string
                                                        description: Название категории
                                                      count:
                                                        type: integer
                                                        description: Количество визитов
                                                      id:
                                                        type: string
                                                        description: ID категории  
  /v3/analytics/visit/detail-report:
    post:
      summary: Детальный отчет о визитах
      tags: 
      - Аналитика
      description: |
        Этот запрос предназначен для получения детального отчета о визитах, фильтруемого по датам, видам животных, округам, районам и организациям.
      requestBody:
              required: true
              content:
                application/x-www-form-urlencoded:
                  schema:
                    type: object
                    properties:
                      from:
                        $ref: '#/components/schemas/from'
                      to:
                        $ref: '#/components/schemas/to'
                      excel:
                        $ref: '#/components/schemas/excel'
                      areas:
                        $ref: '#/components/schemas/areas'
                      districts:
                        $ref: '#/components/schemas/districts'
                      organizations:
                        $ref: '#/components/schemas/organizations'
                      species:
                        $ref: '#/components/schemas/species'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_success:
                    type: boolean
                    description: Флаг успешного выполнения запроса
                  data:
                    type: object
                    properties:
                      count:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: Название категории
                            count:
                              type: integer
                              description: Количество визитов
                            id:
                              type: string
                              description: ID категории
                      areas:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: ID округа
                            name:
                              type: string
                              description: Название округа
                            count:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                    description: Название категории
                                  count:
                                    type: integer
                                    description: Количество визитов
                                  id:
                                    type: string
                                    description: ID категории
                            districts:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    description: ID района
                                  name:
                                    type: string
                                    description: Название района
                                  count:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        name:
                                          type: string
                                          description: Название категории
                                        count:
                                          type: integer
                                          description: Количество визитов
                                        id:
                                          type: string
                                          description: ID категории
                                  organizations:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        id:
                                          type: integer
                                          description: ID организации
                                        name:
                                          type: string
                                          description: Название организации
                                        count:
                                          type: array
                                          items:
                                            type: object
                                            properties:
                                              name:
                                                type: string
                                                description: Название категории
                                              count:
                                                type: integer
                                                description: Количество визитов
                                              id:
                                                type: string
                                                description: ID категории
                                        species:
                                          type: array
                                          items:
                                            type: object
                                            properties:
                                              id:
                                                type: string
                                                description: ID вида
                                              name:
                                                type: string
                                                description: Название вида
                                              count:
                                                type: array
                                                items:
                                                  type: object
                                                  properties:
                                                    name:
                                                      type: string
                                                      description: Название категории
                                                    count:
                                                      type: integer
                                                      description: Количество визитов
                                                    id:
                                                      type: string
                                                      description: ID категории
  /v3/shelters/dictionary:
    get:
      summary: Справочник приютов
      tags: 
      - Приюты
      description: |
        Этот запрос предназначен для получения справочника, содержащего информацию о доступных причинах смерти животных в приютах.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_success:
                    type: boolean
                    description: Признак успешности ответа
                  data:
                    type: object
                    properties:
                      death_reasons:
                        type: array
                        description: Список причин смерти
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: ID причины смерти
                            name:
                              type: string
                              description: Название причины смерти
                            description:
                              type: string
                              description: Описание причины смерти
  /v3/external-services/vks:
    get:
      summary: Получить информацию о визите по GUID
      tags: 
      - Телеветеренария
      description: Возвращает информацию о визите, включая дату, время, длительность, организацию и специалиста, или ошибку 404, если визит не найден
      parameters:
        - in: query
          name: guid
          required: true
          schema:
            type: string
          description: Уникальный идентификатор конференции (GUID)
      responses:
        '200':
          description: Успешный ответ с информацией о визите
          content:
            application/json:
              schema:
                type: object
                properties:
                  sid_guid:
                    type: string
                    description: Уникальный идентификатор конференции
                    example: s07-29f0b60c-11e2-4c22-b075-8d2beb8ce429
                  date:
                    type: string
                    format: date
                    description: Дата визита
                    example: "2024-08-29"
                  slot:
                    type: string
                    format: time
                    description: Время начала визита
                    example: "16:15:00"
                  duration:
                    type: integer
                    description: Длительность визита в минутах
                    example: 30
                  organization:
                    type: string
                    description: Название организации
                    example: "Бабушкинская ВЛ"
                  specialist_fullname:
                    type: string
                    description: Полное имя специалиста
                    example: "Петров Петр Иванович"
                  service:
                    type: string
                    description: Название услуг
                    example: "Видео-консультация"
        '404':
            description: Прием с указанным GUID не найден
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          code:
                            type: string
                            description: Код ошибки
                            example: "404"
                          status:
                            type: string
                            description: HTTP-статус ошибки
                            example: "404"
                          title:
                            type: string
                            description: Краткое описание ошибки
                            example: "Not Found"
                          detail:
                            type: string
                            description: Подробное описание ошибки
                            example: "Не найдено приема с указанным GUID"
  /found-pet/create-ad:
    post:
      summary: Создать объявление о пропаже питомца
      tags:
      - Поиск питомцев
      description: Создает (обновляет) объявление о пропаже питомца и отправляет статус 1050 на ЕТП
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service_number:
                  type: string
                  example: "0001-9000120-067901-00000569/24"
                type:
                  type: string
                  example: "lost"
                sso_id:
                  type: string
                  example: "abc54bee-test-4d9c-9a8f-966363ada92f"
                id_species:
                  type: integer
                  example: 25
                id_breeds:
                  type: integer
                  example: 1
                id_color:
                  type: integer
                  example: 3
                name:
                  type: string
                  example: "Шарик"
                place:
                  type: object
                  properties:
                    city:
                      type: string
                      example: "Москва"
                    area:
                      type: string
                      example: "Центральный"
                    street:
                      type: string
                      example: "Ленинградский проспект"
                    is_map:
                      type: boolean
                      example: true
                    is_manually_set:
                      type: boolean
                      example: false
                    fias_id:
                      type: string
                      example: "fias_123"
                    geo_lat:
                      type: string
                      example: "55.7558"
                    geo_lon:
                      type: string
                      example: "37.6173"
                chip:
                  type: string
                  example: "12345"
                notice:
                  type: string
                  example: "Собака пропала в парке"
                subscribe:
                  type: object
                  properties:
                    email:
                      type: string
                      example: "user@example.com"
                    phone:
                      type: string
                      example: "79161234567"
                    notify:
                      type: boolean
                      example: true
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_ad:
                    type: integer
                    example: 4072
                    description: Идентификатор созданного объявления
